[project]
name = "khatt-engine"
version = "0.1.0"
description = "Linguistically correct Arabic calligraphy generation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.9.0",
    "easyocr>=1.7.2",
    "fastapi>=0.136.3",
    "freetype-py>=2.5.1",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "svgwrite>=1.4.3",
    "typer>=0.25.1",
    "uharfbuzz>=0.54.1",
    "uvicorn>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khatt"]
